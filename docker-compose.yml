services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm_eval
      POSTGRES_PASSWORD: llm_eval
      POSTGRES_DB: llm_eval_lab
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_eval -d llm_eval_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://llm_eval:llm_eval@db:5432/llm_eval_lab
      OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_DEFAULT_MODEL: qwen2.5:7b
    ports:
      - "8000:8000"

volumes:
  db_data:
