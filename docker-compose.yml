services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llm_eval
      POSTGRES_PASSWORD: llm_eval
      POSTGRES_DB: llm_eval_lab
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_eval -d llm_eval_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
