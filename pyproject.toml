[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
llm-eval-lab = "llm_eval_lab:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# ORM model is named TestCase (domain term, matches the eval-platform vocabulary
# used throughout) — not a pytest test class; silence the collection warning.
filterwarnings = [
    "ignore:cannot collect test class 'TestCase':pytest.PytestCollectionWarning",
]
markers = [
    "integration: hits a live Ollama server; excluded by default, run with `-m integration`",
]
addopts = "-m 'not integration'"
