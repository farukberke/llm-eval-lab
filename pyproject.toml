[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "A local LLM evaluation platform: run a QA dataset through different Ollama models/prompts, score responses, and compare configurations side by side."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
llm-eval-lab-ui = "llm_eval_lab.ui.gradio_app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
# ORM model TestCase and its DTO TestCaseRead are domain terms (matches the
# eval-platform vocabulary used throughout) — not pytest test classes; silence
# the collection warning for both (prefix match, no trailing quote).
filterwarnings = [
    "ignore:cannot collect test class 'TestCase:pytest.PytestCollectionWarning",
]
markers = [
    "integration: hits a live Ollama server; excluded by default, run with `-m integration`",
]
addopts = "-m 'not integration'"
